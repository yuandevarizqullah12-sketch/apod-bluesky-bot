name: Daily APOD

on:
  schedule:
    # Hourly 12:00-18:00 WIB (05:00-11:00 UTC). Later runs are no-ops once today's APOD is posted.
    - cron: '0 5,6,7,8,9,10,11 * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit data.json

concurrency:
  group: apod-bot   # shared with flashback so state commits never race
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post today's APOD
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: python apod.py daily
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Update APOD state [skip ci]"
            git pull --rebase -q && git push
          fi
